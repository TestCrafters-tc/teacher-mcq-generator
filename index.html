<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher MCQ Generator (Multi)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']] },
      svg: { fontCache: 'global' },
      options: {
        enableMenu: false
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* iOS-style toggle switch */
    .toggle-container {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }
    
    .toggle-switch {
      display: flex;
      background-color: #e5e7eb;
      border-radius: 9999px;
      padding: 0.25rem;
      position: relative;
      width: 300px;
    }
    
    .toggle-option {
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      text-align: center;
      z-index: 1;
      transition: color 0.3s;
      width: 50%;
    }
    
    .toggle-option.active {
      color: white;
    }
    
    .toggle-slider {
      position: absolute;
      top: 0.25rem;
      bottom: 0.25rem;
      width: 50%;
      background-color: #3b82f6;
      border-radius: 9999px;
      transition: transform 0.3s;
    }
    
    .toggle-slider.right {
      transform: translateX(100%);
    }
    
    /* Print formatter styles */
    .exam-details {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 5px;
    }
    
    .exam-details h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }
    
    .exam-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    
    .exam-details-input {
      margin-bottom: 10px;
    }
    
    .exam-details-input label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    .exam-details-input input,
    .exam-details-input textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .exam-details-input textarea {
      min-height: 80px;
      resize: vertical;
    }
    
    #questions-container {
      column-count: 2;
      column-gap: 40px;
      column-rule: 1px solid #ccc;
      padding: 40px;
    }
    
    .section-view {
      column-count: 1;
    }
    
    .subject-section {
      margin-bottom: 30px;
      break-inside: avoid;
    }
    
    .subject-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 2px solid #333;
      padding-bottom: 5px;
    }
    
    .question-block {
      border: 2px solid transparent;
      padding: 10px;
      border-radius: 6px;
      transition: background-color 0.3s, border-color 0.3s;
      cursor: pointer;
      margin-bottom: 15px;
      break-inside: avoid;
    }
    
    .question-block:hover {
      background-color: #f0f8ff;
    }
    
    .question-block.selected {
      background-color: #e0f3ff;
      border-color: #007bff;
    }
    
    .question-text {
      font-size: 12pt;
      margin-bottom: 8px;
    }
    
    .options {
      font-size: 11pt;
      margin-left: 20px;
      list-style-type: none;
      padding-left: 0;
      counter-reset: option;
    }
    
    .options li {
      counter-increment: option;
      margin-bottom: 8px;
    }
    
    .options li::before {
      content: counter(option, lower-alpha) ". ";
      margin-right: 8px;
    }
    
    .question-number {
      font-weight: bold;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .select-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .view-toggle, .display-options {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .print-header {
      display: none;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #000;
    }
    
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
    }
    
    .status-counter {
      font-weight: bold;
    }
    
    .explanation {
      display: block;
      margin-top: 15px;
      padding: 10px;
      background-color: #f8f9fa;
      border-left: 3px solid #007bff;
      border-radius: 4px;
    }
    
    .subject-selector-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .subject-selector-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .subject-selector-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .json-import-container {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .json-textarea {
      width: 100%;
      min-height: 200px;
      font-family: monospace;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    
    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }
    
      body {
        padding: 0;
      }
    
      .no-print {
        display: none;
      }
    
      .print-header {
        display: block;
      }
    
      #questions-container {
        column-count: 2;
        column-gap: 20px;
        padding: 10mm;
      }
    
      .question-block {
        break-inside: avoid;
        page-break-inside: avoid;
        border: none !important;
        background-color: transparent !important;
        cursor: default !important;
      }
    
      .question-block.selected {
        background-color: transparent !important;
        border: none !important;
      }
    
      .hidden-for-print {
        display: none !important;
      }
    
      .question-text {
        font-size: 11pt;
      }
    
      .options {
        font-size: 10.5pt;
      }
    
      .question-selector {
        display: none;
      }
    
      .status-bar {
        display: none;
      }
    
      /* Ensure MathJax elements are properly sized */
      mjx-container[jax="SVG"] {
        display: inline;
      }
      
      mjx-container[jax="SVG"] > svg {
        max-width: 100% !important;
      }
    
      @page {
        size: A4;
        margin: 10mm;
        marks: none;
      }
    
      @page {
        margin-top: 0;
        margin-bottom: 0;
      }
    
      body {
        padding-top: 1mm;
        padding-bottom: 1mm;
      }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased">
  <div id="root" class="p-6"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function insertAtCursor(input, text) {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const newText = input.value.substring(0, start) + text + input.value.substring(end);
      input.value = newText;
      input.selectionStart = input.selectionEnd = start + text.length;
      input.focus();
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function MathSymbolToolbar({ targetRef }) {
      const symbols = [
        { label: "x²", value: "^{2}" }, { label: "xₙ", value: "_{n}" },
        { label: "∫", value: "\\int" }, { label: "√", value: "\\sqrt{}" },
        { label: "π", value: "\\pi" }, { label: "θ", value: "\\theta" },
        { label: "∞", value: "\\infty" }, { label: "∑", value: "\\sum" },
        { label: "→", value: "\\rightarrow" }, { label: "≈", value: "\\approx" },
        { label: "≠", value: "\\ne" }, { label: "≥", value: "\\ge" },
        { label: "≤", value: "\\le" }, { label: "α", value: "\\alpha" },
        { label: "β", value: "\\beta" }, { label: "Δ", value: "\\Delta" }
      ];

      return (
        <div className="flex flex-wrap gap-2 mb-2">
          {symbols.map((sym) => (
            <button
              key={sym.label}
              type="button"
              className="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-sm"
              onClick={() => {
                if (targetRef.current) insertAtCursor(targetRef.current, sym.value);
              }}
            >
              {sym.label}
            </button>
          ))}
        </div>
      );
    }

    function LivePreview({ content }) {
      useEffect(() => {
        MathJax.typeset();
      }, [content]);

      return (
        <div className="mt-1 bg-white border rounded px-2 py-1 text-sm text-gray-700">
          <span dangerouslySetInnerHTML={{ __html: `\\(${content}\\)` }} />
        </div>
      );
    }

    function JsonImport({ onImport }) {
      const [jsonInput, setJsonInput] = useState("");
      const [error, setError] = useState(null);

      const handleImport = () => {
        try {
          const parsed = JSON.parse(jsonInput);
          
          // Handle both single question and array of questions
          const questions = Array.isArray(parsed) ? parsed : [parsed];
          
          // Validate questions
          const validQuestions = questions.filter(q => 
            q.question && q.options && q.options.length > 0 && q.correctAnswer !== undefined
          );
          
          if (validQuestions.length === 0) {
            throw new Error("No valid questions found in the JSON");
          }
          
          onImport(validQuestions);
          setJsonInput("");
          setError(null);
        } catch (err) {
          setError(`Error parsing JSON: ${err.message}`);
        }
      };

      return (
        <div className="json-import-container">
          <h2 className="text-xl font-semibold mb-4 text-blue-600">Import Questions from JSON</h2>
          <textarea
            className="json-textarea"
            value={jsonInput}
            onChange={(e) => setJsonInput(e.target.value)}
            placeholder={`Paste your JSON here, e.g.:\n\n{\n  "question": "What is 2+2?",\n  "options": ["3", "4", "5", "6"],\n  "correctAnswer": 1,\n  "explanation": "Basic addition",\n  "subject": "Math",\n  "difficulty": "easy"\n}\n\nOr an array of questions:\n\n[\n  { /* question 1 */ },\n  { /* question 2 */ }\n]`}
          />
          {error && <div className="text-red-600 mb-2">{error}</div>}
          <button
            onClick={handleImport}
            className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"
            disabled={!jsonInput.trim()}
          >
            Import Questions
          </button>
        </div>
      );
    }

    function QuestionForm({ onSave, subject, setSubject, editingData }) {
      const subjects = ["Physics", "Chemistry", "Math", "Biology", "ICT"];
      const [question, setQuestion] = useState(editingData?.question || "");
      const [options, setOptions] = useState(editingData?.options || ["", "", "", ""]);
      const [correctAnswer, setCorrectAnswer] = useState(editingData?.correctAnswer || 0);
      const [explanation, setExplanation] = useState(editingData?.explanation || "");
      const [difficulty, setDifficulty] = useState(editingData?.difficulty || "medium");
      const [tags, setTags] = useState(editingData?.tags?.join(", ") || "");

      const questionRef = useRef(null);
      const explanationRef = useRef(null);
      const optionRefs = useRef(options.map(() => React.createRef()));

      const handleOptionChange = (index, value) => {
        const updated = [...options];
        updated[index] = value;
        setOptions(updated);
      };

      const handleAdd = () => {
        if (!question.trim()) {
          alert("Please enter a question.");
          return;
        }

        onSave({
          question,
          options,
          correctAnswer,
          explanation,
          subject,
          difficulty,
          tags: tags.split(",").map(tag => tag.trim()).filter(tag => tag)
        });

        setQuestion("");
        setOptions(["", "", "", ""]);
        setCorrectAnswer(0);
        setExplanation("");
        setTags("");
      };

      useEffect(() => {
        MathJax.typeset();
      }, [question, explanation, options]);

      return (
        <div className="bg-white p-6 rounded-xl shadow mb-6">
          <h2 className="text-lg font-bold mb-4 text-blue-600">➕ {editingData ? 'Edit' : 'Add'} Question</h2>

          <label className="block font-medium">Subject</label>
          <select
            className="w-full p-2 mb-4 rounded-lg border"
            value={subject}
            onChange={(e) => setSubject(e.target.value)}
          >
            {subjects.map((s) => <option key={s}>{s}</option>)}
          </select>

          <label className="block font-medium">Question</label>
          <MathSymbolToolbar targetRef={questionRef} />
          <textarea
            ref={questionRef}
            className="w-full mb-2 p-3 border rounded-lg"
            rows="3"
            value={question}
            onChange={(e) => setQuestion(e.target.value)}
          />
          <LivePreview content={question} />

          {options.map((opt, i) => (
            <div key={i} className="mb-3">
              <label className="font-medium">Option {String.fromCharCode(65 + i)}</label>
              <MathSymbolToolbar targetRef={optionRefs.current[i]} />
              <input
                ref={optionRefs.current[i]}
                className="w-full p-2 border rounded-lg"
                value={opt}
                onChange={(e) => handleOptionChange(i, e.target.value)}
              />
              <LivePreview content={opt} />
            </div>
          ))}

          <label className="block font-medium mt-4">Correct Answer</label>
          <div className="flex gap-4 mb-4">
            {options.map((_, i) => (
              <label key={i} className="flex items-center gap-2">
                <input
                  type="radio"
                  name="correct"
                  checked={correctAnswer === i}
                  onChange={() => setCorrectAnswer(i)}
                />
                {String.fromCharCode(65 + i)}
              </label>
            ))}
          </div>

          <div className="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label className="block font-medium">Difficulty</label>
              <select
                className="w-full p-2 rounded-lg border"
                value={difficulty}
                onChange={(e) => setDifficulty(e.target.value)}
              >
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <div>
              <label className="block font-medium">Tags (comma separated)</label>
              <input
                className="w-full p-2 border rounded-lg"
                value={tags}
                onChange={(e) => setTags(e.target.value)}
                placeholder="e.g., algebra, geometry"
              />
            </div>
          </div>

          <label className="block font-medium">Explanation</label>
          <MathSymbolToolbar targetRef={explanationRef} />
          <textarea
            ref={explanationRef}
            className="w-full mb-2 p-3 border rounded-lg"
            rows="3"
            value={explanation}
            onChange={(e) => setExplanation(e.target.value)}
          />
          <LivePreview content={explanation} />

          <button
            onClick={handleAdd}
            className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"
          >
            {editingData ? "✅ Update" : "➕ Add"} Question
          </button>
        </div>
      );
    }

    function JsonFormatter({ questions }) {
      const [jsonOutput, setJsonOutput] = useState("");

      const generateJSON = () => {
        const output = JSON.stringify(questions, null, 2);
        setJsonOutput(output);
        MathJax.typeset();
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(jsonOutput);
        alert("Copied all questions to clipboard!");
      };

      const downloadJSON = () => {
        const blob = new Blob([jsonOutput], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "mcq_questions.json";
        link.click();
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow">
          <h2 className="text-xl font-semibold mb-4 text-blue-600">JSON Code Formatter</h2>
          
          <button
            onClick={generateJSON}
            className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 mb-4"
          >
            🔄 Generate JSON
          </button>

          {jsonOutput && (
            <div>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-lg font-semibold">📦 Generated JSON:</h3>
                <div className="flex gap-4">
                  <button onClick={copyToClipboard} className="text-blue-600 text-sm hover:underline">
                    Copy JSON
                  </button>
                  <button onClick={downloadJSON} className="text-green-600 text-sm hover:underline">
                    Download JSON
                  </button>
                </div>
              </div>
              <pre className="bg-gray-100 p-4 rounded-lg text-sm overflow-auto">{jsonOutput}</pre>
            </div>
          )}
        </div>
      );
    }

    function PrintFormatter({ questions }) {
      const [selectedQuestions, setSelectedQuestions] = useState(new Set());
      const [currentView, setCurrentView] = useState('column');
      const [showAnswers, setShowAnswers] = useState(true);
      const [showExplanations, setShowExplanations] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSubjects, setSelectedSubjects] = useState(new Set());
      const [selectedDifficulties, setSelectedDifficulties] = useState(new Set());
      const [selectedTags, setSelectedTags] = useState(new Set());
      const [filteredQuestions, setFilteredQuestions] = useState([]);
      
      const containerRef = useRef(null);
      const examNameRef = useRef(null);
      const examTimeRef = useRef(null);
      const examMarksRef = useRef(null);
      const examInstructionsRef = useRef(null);

      const toggleQuestionSelection = (index) => {
        const newSelected = new Set(selectedQuestions);
        if (newSelected.has(index)) {
          newSelected.delete(index);
        } else {
          newSelected.add(index);
        }
        setSelectedQuestions(newSelected);
      };

      const toggleSelectAll = () => {
  if (selectedQuestions.size === filteredQuestions.length) {
    setSelectedQuestions(new Set());
  } else {
    setSelectedQuestions(new Set(filteredQuestions.map((_, i) => i)));
  }
};

      const selectBySubject = (subject) => {
        const newSelected = new Set();
        filteredQuestions.forEach((q, i) => {
          if (q.subject === subject) {
            newSelected.add(i);
          }
        });
        setSelectedQuestions(newSelected);
      };

      const randomlySelectSubjectQuestions = (subject) => {
        const subjectQuestions = filteredQuestions.filter(q => q.subject === subject);
        if (subjectQuestions.length === 0) {
          alert(`No ${subject} questions found!`);
          return;
        }
        
        const count = Math.max(1, Math.floor(subjectQuestions.length * 0.5));
        const shuffled = [...Array(subjectQuestions.length).keys()].sort(() => 0.5 - Math.random());
        const selectedIndices = shuffled.slice(0, count);
        
        const newSelected = new Set();
        filteredQuestions.forEach((q, i) => {
          if (q.subject === subject && selectedIndices.includes(subjectQuestions.indexOf(q))) {
            newSelected.add(i);
          }
        });
        
        setSelectedQuestions(newSelected);
        alert(`Randomly selected ${count} ${subject} questions`);
      };

      const printSelected = () => {
        if (selectedQuestions.size === 0) {
          alert('Please select at least one question to print.');
          return;
        }

        const printWindow = window.open('', '', 'width=800,height=600');
        printWindow.document.write('<html><head><title>Print Questions</title>');
        printWindow.document.write('<style>');
        printWindow.document.write(`
          body {
            font-family: Arial, sans-serif;
            margin: 20px;
          }
          .print-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000;
          }
          .question-block {
            margin-bottom: 20px;
            page-break-inside: avoid;
          }
          .question-text {
            font-size: 12pt;
            margin-bottom: 8px;
          }
          .options {
            font-size: 11pt;
            margin-left: 20px;
            list-style-type: none;
            padding-left: 0;
            counter-reset: option;
          }
          .options li {
            counter-increment: option;
            margin-bottom: 8px;
          }
          .options li::before {
            content: counter(option, lower-alpha) ". ";
            margin-right: 8px;
          }
          .explanation {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 3px solid #007bff;
            border-radius: 4px;
          }
          mjx-container[jax="SVG"] {
            display: inline;
          }
          mjx-container[jax="SVG"] > svg {
            max-width: 100% !important;
          }
          @page {
            size: A4;
            margin: 10mm;
          }
        `);
        printWindow.document.write('</style>');
        printWindow.document.write('<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"><\/script>');
        printWindow.document.write('<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>');
        printWindow.document.write('</head><body>');

        // Add exam details
        printWindow.document.write('<div class="print-header">');
        printWindow.document.write(`<h2>${examNameRef.current?.value || 'Exam Paper'}</h2>`);
        
        const examTime = examTimeRef.current?.value;
        const examMarks = examMarksRef.current?.value;
        if (examTime || examMarks) {
          printWindow.document.write(`<div>${examTime ? 'Time: ' + examTime : ''} ${examMarks ? 'Marks: ' + examMarks : ''}</div>`);
        }
        
        const instructions = examInstructionsRef.current?.value;
        if (instructions) {
          printWindow.document.write(`<div>${instructions}</div>`);
        }
        
        printWindow.document.write('</div>');

        // Add selected questions
        const selectedIndices = Array.from(selectedQuestions).sort((a, b) => a - b);
        selectedIndices.forEach((index, i) => {
          const q = filteredQuestions[index];
          printWindow.document.write('<div class="question-block">');
          printWindow.document.write(`<div class="question-text"><span class="question-number">Q${i + 1}:</span> ${q.question}</div>`);
          
          printWindow.document.write('<ul class="options">');
          q.options.forEach((option, j) => {
            printWindow.document.write('<li');
            if (showAnswers && j === q.correctAnswer) {
              printWindow.document.write(' style="font-weight:bold;color:green;"');
            }
            printWindow.document.write(`>${option}</li>`);
          });
          printWindow.document.write('</ul>');
          
          if (showExplanations && q.explanation) {
            printWindow.document.write(`<div class="explanation">${q.explanation}</div>`);
          }
          
          printWindow.document.write('</div>');
        });

        printWindow.document.write('</body></html>');
        printWindow.document.close();
        
        // Wait for MathJax to load and typeset before printing
        const checkMathJax = setInterval(() => {
          if (printWindow.MathJax && printWindow.MathJax.typesetPromise) {
            clearInterval(checkMathJax);
            printWindow.MathJax.typesetPromise().then(() => {
              // Add small delay to ensure rendering is complete
              setTimeout(() => {
                printWindow.print();
              }, 500);
            });
          }
        }, 100);
      };

      const applyFilters = () => {
        const filtered = questions.filter(q => {
          if (searchQuery && !q.question.toLowerCase().includes(searchQuery.toLowerCase())) {
            return false;
          }
          
          if (selectedSubjects.size > 0 && !selectedSubjects.has(q.subject)) {
            return false;
          }
          
          if (selectedDifficulties.size > 0 && !selectedDifficulties.has(q.difficulty)) {
            return false;
          }
          
          if (selectedTags.size > 0) {
            const questionTags = new Set(q.tags || []);
            const intersection = new Set([...selectedTags].filter(tag => questionTags.has(tag)));
            if (intersection.size === 0) {
              return false;
            }
          }
          
          return true;
        });
        
        setFilteredQuestions(filtered);
      };

      useEffect(() => {
        applyFilters();
      }, [questions, searchQuery, selectedSubjects, selectedDifficulties, selectedTags]);

      const toggleSubject = (subject) => {
        const newSubjects = new Set(selectedSubjects);
        if (newSubjects.has(subject)) {
          newSubjects.delete(subject);
        } else {
          newSubjects.add(subject);
        }
        setSelectedSubjects(newSubjects);
      };

      const toggleDifficulty = (difficulty) => {
        const newDifficulties = new Set(selectedDifficulties);
        if (newDifficulties.has(difficulty)) {
          newDifficulties.delete(difficulty);
        } else {
          newDifficulties.add(difficulty);
        }
        setSelectedDifficulties(newDifficulties);
      };

      const toggleTag = (tag) => {
        const newTags = new Set(selectedTags);
        if (newTags.has(tag)) {
          newTags.delete(tag);
        } else {
          newTags.add(tag);
        }
        setSelectedTags(newTags);
      };

      const clearAllFilters = () => {
        setSearchQuery('');
        setSelectedSubjects(new Set());
        setSelectedDifficulties(new Set());
        setSelectedTags(new Set());
      };

      const uniqueSubjects = [...new Set(questions.map(q => q.subject))];
      const uniqueTags = [...new Set(questions.flatMap(q => q.tags || []))];

      return (
        <div className="bg-white p-6 rounded-xl shadow">
          <h2 className="text-xl font-semibold mb-4 text-blue-600">Printed Question Formatter</h2>
          
          <div className="exam-details mb-6">
            <h2 className="text-lg font-bold mb-2">Exam Details</h2>
            <div className="exam-details-grid">
              <div className="exam-details-input">
                <label htmlFor="exam-name">Exam Name:</label>
                <input 
                  type="text" 
                  id="exam-name" 
                  ref={examNameRef}
                  placeholder="Enter exam name" 
                  className="w-full p-2 border rounded"
                />
              </div>
              <div className="exam-details-input">
                <label htmlFor="exam-time">Time:</label>
                <input 
                  type="text" 
                  id="exam-time" 
                  ref={examTimeRef}
                  placeholder="e.g. 1 hour" 
                  className="w-full p-2 border rounded"
                />
              </div>
              <div className="exam-details-input">
                <label htmlFor="exam-marks">Total Marks:</label>
                <input 
                  type="text" 
                  id="exam-marks" 
                  ref={examMarksRef}
                  placeholder="e.g. 100" 
                  className="w-full p-2 border rounded"
                />
              </div>
            </div>
            <div className="exam-details-input">
              <label htmlFor="exam-instructions">Instructions:</label>
              <textarea 
                id="exam-instructions" 
                ref={examInstructionsRef}
                placeholder="Enter exam instructions" 
                className="w-full p-2 border rounded"
                rows="3"
              />
            </div>
          </div>
          
          <div className="subject-selector-container mb-6">
            <button
              onClick={() => randomlySelectSubjectQuestions('Chemistry')}
              className="subject-selector-btn bg-blue-100 text-blue-800 hover:bg-blue-200"
            >
              Random Chemistry (50%)
            </button>
            <button
              onClick={() => randomlySelectSubjectQuestions('Physics')}
              className="subject-selector-btn bg-green-100 text-green-800 hover:bg-green-200"
            >
              Random Physics (50%)
            </button>
            <button
              onClick={() => randomlySelectSubjectQuestions('Biology')}
              className="subject-selector-btn bg-purple-100 text-purple-800 hover:bg-purple-200"
            >
              Random Biology (50%)
            </button>
            <button
              onClick={() => randomlySelectSubjectQuestions('Math')}
              className="subject-selector-btn bg-yellow-100 text-yellow-800 hover:bg-yellow-200"
            >
              Random Math (50%)
            </button>
          </div>
          
          <div className="search-filter-container mb-6">
            <div className="search-box">
              <input 
                type="text" 
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search questions..." 
                className="w-full p-2 border rounded"
              />
            </div>
            
            <div className="filters-container">
              <div className="filter-group">
                <h3 className="font-medium">Subject</h3>
                <div className="filter-checkbox-group">
                  {uniqueSubjects.map(subject => (
                    <div key={subject} className="filter-checkbox-item">
                      <input
                        type="checkbox"
                        id={`subject-${subject}`}
                        checked={selectedSubjects.has(subject)}
                        onChange={() => toggleSubject(subject)}
                      />
                      <label htmlFor={`subject-${subject}`}>{subject}</label>
                    </div>
                  ))}
                </div>
              </div>
              
              <div className="filter-group">
                <h3 className="font-medium">Difficulty</h3>
                <div className="filter-options">
                  <button
                    className={`filter-tag ${selectedDifficulties.has('easy') ? 'active' : ''}`}
                    onClick={() => toggleDifficulty('easy')}
                  >
                    Easy
                  </button>
                  <button
                    className={`filter-tag ${selectedDifficulties.has('medium') ? 'active' : ''}`}
                    onClick={() => toggleDifficulty('medium')}
                  >
                    Medium
                  </button>
                  <button
                    className={`filter-tag ${selectedDifficulties.has('hard') ? 'active' : ''}`}
                    onClick={() => toggleDifficulty('hard')}
                  >
                    Hard
                  </button>
                </div>
              </div>
              
              {uniqueTags.length > 0 && (
                <div className="filter-group">
                  <h3 className="font-medium">Tags</h3>
                  <div className="filter-options">
                    {uniqueTags.map(tag => (
                      <button
                        key={tag}
                        className={`filter-tag ${selectedTags.has(tag) ? 'active' : ''}`}
                        onClick={() => toggleTag(tag)}
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
            
            <div className="filter-actions mt-4">
              <button 
                onClick={clearAllFilters}
                className="text-blue-600 hover:underline"
              >
                Clear All Filters
              </button>
            </div>
          </div>
          
          <div className="controls mb-4">
            <div className="select-controls">
              <div className="checkbox-container">
                <input 
                  type="checkbox" 
                  id="select-all"
                  checked={selectedQuestions.size === filteredQuestions.length && filteredQuestions.length > 0}
                  onChange={toggleSelectAll}
                />
                <label htmlFor="select-all">Select All</label>
              </div>
              {uniqueSubjects.map(subject => (
                <button 
                  key={subject}
                  onClick={() => selectBySubject(subject)}
                  className="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300"
                >
                  Select {subject}
                </button>
              ))}
            </div>
            
            <button 
              onClick={printSelected}
              className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
              disabled={selectedQuestions.size === 0}
            >
              🖨️ Print Selected ({selectedQuestions.size})
            </button>
          </div>
          
          <div className="view-toggle mb-4">
            <button
              className={`px-3 py-1 rounded ${currentView === 'column' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
              onClick={() => setCurrentView('column')}
            >
              Column View
            </button>
            <button
              className={`px-3 py-1 rounded ${currentView === 'section' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
              onClick={() => setCurrentView('section')}
            >
              Subject Section View
            </button>
          </div>
          
          <div className="display-options mb-4">
            <span className="font-medium">Display Options:</span>
            <button
              className={`px-3 py-1 rounded ${showAnswers ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
              onClick={() => setShowAnswers(true)}
            >
              Show Answers
            </button>
            <button
              className={`px-3 py-1 rounded ${!showAnswers ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
              onClick={() => setShowAnswers(false)}
            >
              Hide Answers
            </button>
            <button
              className={`px-3 py-1 rounded ${showExplanations ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
              onClick={() => setShowExplanations(true)}
            >
              Show Explanations
            </button>
            <button
              className={`px-3 py-1 rounded ${!showExplanations ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
              onClick={() => setShowExplanations(false)}
            >
              Hide Explanations
            </button>
          </div>
          
          <div 
            id="questions-container" 
            ref={containerRef}
            className={`${currentView === 'section' ? 'section-view' : ''}`}
          >
            {filteredQuestions.length === 0 ? (
              <div className="text-center py-10 text-gray-500">
                No questions match your search criteria.
              </div>
            ) : currentView === 'section' ? (
              uniqueSubjects.filter(subject => 
                filteredQuestions.some(q => q.subject === subject)
              ).map(subject => (
                <div key={subject} className="subject-section">
                  <div className="subject-header">{subject}</div>
                  {filteredQuestions
                    .filter(q => q.subject === subject)
                    .map((q, index) => (
                      <div 
                        key={index}
                        className={`question-block ${selectedQuestions.has(index) ? 'selected' : ''}`}
                        onClick={() => toggleQuestionSelection(index)}
                      >
                        <div className="question-text">
                          Q{index + 1}: {q.question}
                          <span className={`difficulty-tag difficulty-${q.difficulty}`}>
                            {q.difficulty}
                          </span>
                        </div>
                        <ul className="options">
                          {q.options.map((option, i) => (
                            <li 
                              key={i}
                              style={showAnswers && i === q.correctAnswer ? 
                                { fontWeight: 'bold', color: 'green' } : {}}
                            >
                              {option}
                            </li>
                          ))}
                        </ul>
                        {showExplanations && q.explanation && (
                          <div className="explanation">
                            {q.explanation}
                          </div>
                        )}
                        {q.tags && q.tags.length > 0 && (
                          <div className="question-tags">
                            {q.tags.map(tag => (
                              <span key={tag} className="question-tag">{tag}</span>
                            ))}
                          </div>
                        )}
                      </div>
                    ))
                  }
                </div>
              ))
            ) : (
              filteredQuestions.map((q, index) => (
                <div 
                  key={index}
                  className={`question-block ${selectedQuestions.has(index) ? 'selected' : ''}`}
                  onClick={() => toggleQuestionSelection(index)}
                >
                  <div className="question-text">
                    Q{index + 1}: {q.question}
                    <span className={`difficulty-tag difficulty-${q.difficulty}`}>
                      {q.difficulty}
                    </span>
                  </div>
                  <ul className="options">
                    {q.options.map((option, i) => (
                      <li 
                        key={i}
                        style={showAnswers && i === q.correctAnswer ? 
                          { fontWeight: 'bold', color: 'green' } : {}}
                      >
                        {option}
                      </li>
                    ))}
                  </ul>
                  {showExplanations && q.explanation && (
                    <div className="explanation">
                      {q.explanation}
                    </div>
                  )}
                  {q.tags && q.tags.length > 0 && (
                    <div className="question-tags">
                      {q.tags.map(tag => (
                        <span key={tag} className="question-tag">{tag}</span>
                      ))}
                    </div>
                  )}
                </div>
              ))
            )}
          </div>
          
          <div className="status-bar">
            <div className="status-counter">
              Selected: {selectedQuestions.size} of {filteredQuestions.length} questions
            </div>
            <div className="status-actions">
              <button 
                onClick={printSelected}
                className="px-3 py-1 bg-green-600 text-white rounded"
                disabled={selectedQuestions.size === 0}
              >
                Print Selected
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [questions, setQuestions] = useState([]);
      const [subject, setSubject] = useState("Math");
      const [editIndex, setEditIndex] = useState(null);
      const [activeTab, setActiveTab] = useState('generator');

      const addQuestion = (q) => {
        if (editIndex !== null) {
          const updated = [...questions];
          updated[editIndex] = q;
          setQuestions(updated);
          setEditIndex(null);
        } else {
          setQuestions([...questions, q]);
        }
      };

      const importQuestions = (newQuestions) => {
        setQuestions([...questions, ...newQuestions]);
      };

      const removeQuestion = (index) => {
        const updated = [...questions];
        updated.splice(index, 1);
        setQuestions(updated);
      };

      return (
        <div className="max-w-5xl mx-auto">
          <h1 className="text-3xl font-bold text-blue-600 mb-6 text-center">
            🧠 Comprehensive MCQ Tool
          </h1>
          
          <div className="toggle-container">
            <div className="toggle-switch">
              <div className={`toggle-option ${activeTab === 'generator' ? 'active' : ''}`} 
                   onClick={() => setActiveTab('generator')}>
                MCQ Generator
              </div>
              <div className={`toggle-option ${activeTab === 'formatter' ? 'active' : ''}`} 
                   onClick={() => setActiveTab('formatter')}>
                Question Formatter
              </div>
              <div className={`toggle-slider ${activeTab === 'formatter' ? 'right' : ''}`}></div>
            </div>
          </div>
          
          {activeTab === 'generator' ? (
            <>
              <JsonImport onImport={importQuestions} />
              <QuestionForm
                onSave={addQuestion}
                subject={subject}
                setSubject={setSubject}
                editingData={editIndex !== null ? questions[editIndex] : null}
              />

              {questions.length > 0 && (
                <>
                  <h2 className="text-xl font-semibold mb-3 text-gray-700">📋 Added Questions</h2>
                  <ul className="mb-6 space-y-4">
                    {questions.map((q, idx) => (
                      <li key={idx} className="p-4 bg-white rounded-lg shadow relative">
                        <div className="mb-1 font-medium">Q{idx + 1}:</div>
                        <div className="mb-2 text-sm text-gray-700">{q.question}</div>
                        <div className="text-xs text-gray-500">Subject: {q.subject}</div>
                        <button
                          onClick={() => removeQuestion(idx)}
                          className="absolute top-2 right-2 text-red-500 hover:underline text-sm"
                        >
                          Remove
                        </button>
                        <button
                          onClick={() => setEditIndex(idx)}
                          className="absolute top-2 right-20 text-blue-500 hover:underline text-sm"
                        >
                          Edit
                        </button>
                      </li>
                    ))}
                  </ul>
                </>
              )}
            </>
          ) : (
            <div className="space-y-6">
              <JsonFormatter questions={questions} />
              <PrintFormatter questions={questions} />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
